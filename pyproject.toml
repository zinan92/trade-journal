[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-journal"
version = "0.1.0"
description = "Trade Journal — 本地命令行 K 线驱动的交易复盘日记与纪律库"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
trade-journal = "trade_journal.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trade_journal = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
